services:

  mysql:
    image: mysql:8.4
    container_name: smartsave_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: smartsave_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/smartsave_backup.sql:/docker-entrypoint-initdb.d/smartsave_backup.sql:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: smartsave_backend

    restart: unless-stopped

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: smartsave_db

    ports:
      - "8000:8000"

    depends_on:
      - mysql

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: smartsave_frontend

    restart: unless-stopped

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: smartsave_db

    ports:
      - "8501:8501"

    depends_on:
      - mysql
      - backend


volumes:
  mysql_data:
  